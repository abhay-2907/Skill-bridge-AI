services:
  # ── Backend Web Service (FastAPI) ──────────────────────────────────────────
  - type: web
    name: skillbridge-ai-backend
    env: python
    region: singapore
    buildCommand: "pip install -r requirements.txt && python -m app.database.init_db"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHONPATH
        value: ./backend
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./careerpilot.db
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b

  # ── Frontend Static Site (React + Vite) ──────────────────────────────────
  - type: web
    name: skillbridge-ai-frontend
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
